version: '3.8'

services:
  chat_commander:
    container_name: chat_commander
    build: ./
    # restart: always
    environment:
      ENV: "${ENV}"
      TOKEN: "${TOKEN}"
      OWNER_ID: "${OWNER_ID}"
      OWNER_USERNAME: "${OWNER_USERNAME}"
      DATABASE_URL: "${DATABASE_URL}"
      MESSAGE_DUMP: "${MESSAGE_DUMP}"
      LOAD: "${LOAD}"
      NO_LOAD: "${NO_LOAD}"
      WEBHOOK: "${WEBHOOK}"
      URL: "${URL}"
      SUDO_USERS: "${SUDO_USERS}"
      SUPPORT_USERS: "${SUPPORT_USERS}"
      WHITELIST_USERS: "${WHITELIST_USERS}"
      DONATION_LINK: "${DONATION_LINK}"
      CERT_PATH: "${CERT_PATH}"
      PORT: "${PORT}"
      DEL_CMDS: "${DEL_CMDS}"
      BAN_STICKER: "${BAN_STICKER}"
      ALLOW_EXCL: "${ALLOW_EXCL}"
      LOG_LEVEL: "${LOG_LEVEL}"
    depends_on:
      - chat_commander-db
    # ports:
    #   - "${PORT}:${PORT}"

  chat_commander-db:
    container_name: chat_commander-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - /sec/chatcomm/postgresql:/var/lib/postgresql
